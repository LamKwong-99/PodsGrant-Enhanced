name: Build PodsGrant Enhanced

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        scheme: [rootful, rootless]
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Install dpkg
        run: brew install dpkg || true

      - name: Build Rootful Package
        if: matrix.scheme == 'rootful'
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1 DEBUG=0
          ls -la packages/

      - name: Build Rootless Package
        if: matrix.scheme == 'rootless'
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodsGrant-Enhanced-${{ matrix.scheme }}
          path: packages/*.deb
